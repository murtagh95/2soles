# Corre todos los tests en cada push y PR, incluidos los de firestore.rules
# (que Cloudflare no puede correr porque necesitan Java para el emulador)
name: Tests

on:
  push:
  pull_request:

# El token de GitHub solo puede leer el repo: los tests no necesitan escribir nada
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # Falla si una dependencia que llega al sitio publicado tiene una vulnerabilidad alta o crítica
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:reglas
      - run: pnpm build
