<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Alquilá por día un quincho con pileta, parque y churrasquera en Maipú, Mendoza. Jornada de 10:30 a 19:30 hs. Mirá la disponibilidad y reservá por WhatsApp."
    />
    <link rel="canonical" href="https://dossoles.mysavia.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/images/portada.webp" fetchpriority="high" />
    <meta name="theme-color" content="#16a34a" />

    <!-- Vista previa al compartir el link (WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Dos Soles" />
    <meta property="og:title" content="Quincho con pileta en Maipú, Mendoza | Dos Soles" />
    <meta property="og:description" content="Quincho, pileta, parque y churrasquera para alquilar por día. Jornada de 10:30 a 19:30 hs." />
    <meta property="og:url" content="https://dossoles.mysavia.app/" />
    <meta property="og:image" content="https://dossoles.mysavia.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pileta y parque del quincho Dos Soles" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos estructurados: Google entiende que es un lugar con dirección, horario y precio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["LocalBusiness", "EventVenue"],
        "name": "Dos Soles",
        "description": "Quincho con pileta, parque y churrasquera para alquilar por día en Maipú, Mendoza.",
        "url": "https://dossoles.mysavia.app/",
        "image": "https://dossoles.mysavia.app/og.jpg",
        "telephone": "+5492612528971",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Ceferino de Tierra 544",
          "addressLocality": "Maipú",
          "addressRegion": "Mendoza",
          "addressCountry": "AR"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": -33.036916, "longitude": -68.745626 },
        "hasMap": "https://maps.app.goo.gl/t2wiiPA7AunoAm3o6",
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "10:30",
          "closes": "19:30"
        },
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Pileta", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Quincho techado", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Churrasquera", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Parque", "value": true }
        ]
      }
    </script>
  </head>
  <body class="bg-stone-100 font-sans text-gray-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
